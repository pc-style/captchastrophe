name: Publish authorized fork preview
on:
  # Runs from main after CI passes for a CodeRabbit-approved PR head.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number (current head must pass CI)
        required: true
        type: string
permissions: {}
concurrency:
  group: preview-${{ inputs.pr || github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' && vars.HOSTING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'pull_request_review' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the open entry-only PR for this CI run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_PR" ]; then echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"; exit 0; fi
          number=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$OWNER:$BRANCH" \
            --jq "map(select(.head.sha == \"$SHA\")) | .[0].number // empty")
          if [ -z "$number" ]; then echo "No open PR has head $SHA; nothing to preview."; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" --jq '.[].filename')
          ids=$(printf '%s\n' "$files" | sed -nE 's#^submissions/([a-z0-9]+(-[a-z0-9]+)*)/.*#\1#p' | sort -u)
          if printf '%s\n' "$files" | grep -qvE '^submissions/' || [ "$(printf '%s\n' "$ids" | grep -c .)" != 1 ]; then
            echo "PR #$number is not a single-entry PR; previews cover entries only."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
  preview:
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Verify PR scope, CodeRabbit approval and artifact provenance
        id: source
        run: node .github/scripts/prepare-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.resolve.outputs.pr }}
      - name: Build trusted gallery without auth
        run: node scripts/build-site.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: downloaded
          merge-multiple: true
      - name: Validate static artifact and select only this entry
        run: node .github/scripts/validate-artifact.ts
      - name: Publish static preview
        id: publish
        run: node scripts/publish.ts
        env:
          PREVIEW_PR: ${{ needs.resolve.outputs.pr }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      - name: Post preview link
        run: node .github/scripts/comment-preview.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.resolve.outputs.pr }}
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
