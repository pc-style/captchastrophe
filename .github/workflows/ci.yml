name: CI
on:
  # PR checks start only once CodeRabbit approves the current head; see the gate step.
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A step, not a job condition: a skipped `checks` job would satisfy the required check.
      - name: Require CodeRabbit approval of the current head
        if: github.event_name == 'pull_request_review'
        shell: bash # adds pipefail, so a failed page fetch can't hide behind `tail`
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" \
            --jq ".[] | select(.user.login == \"coderabbitai[bot]\" and .commit_id == \"$HEAD\" and .state != \"COMMENTED\") | .state" | tail -n 1)
          if [ "$state" != APPROVED ]; then
            echo "::error::Waiting for CodeRabbit to approve $HEAD (latest verdict: ${state:-none})."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Browser contract checks (neutral fixtures only)
        run: |
          node scripts/build-play.ts --include-fixtures
          node scripts/browser-check.ts
          node scripts/build-play.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-${{ github.run_id }}
          path: dist/play
          if-no-files-found: error
          retention-days: 7
